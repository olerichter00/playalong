<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Key Finder</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main>
      <header>
        <h1>Key Finder</h1>
        <p>Play along on your keyboard. The page listens, estimates the key, and highlights that scale on the piano.</p>
      </header>

      <section class="controls">
        <button id="listen" type="button">Start listening</button>
        <div id="transport" class="transport" hidden>
          <button id="pause" type="button" class="icon-button" aria-pressed="false" aria-label="Pause: keep listening but freeze the key" title="Pause (keep listening, freeze the key)">
            <svg class="icon-pause" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M6 4h4v16H6zM14 4h4v16h-4z" /></svg>
            <svg class="icon-resume" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M7 4l13 8-13 8z" /></svg>
          </button>
          <button id="stop" type="button" class="icon-button" aria-label="Stop listening" title="Stop listening">
            <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M5 5h14v14H5z" /></svg>
          </button>
        </div>
        <div class="meter" aria-hidden="true"><span id="level"></span></div>
        <button id="pick-toggle" type="button" class="secondary" aria-expanded="false" aria-controls="key-picker">Choose a key</button>
        <p id="status" role="status">Microphone is off.</p>
      </section>

      <section id="key-picker" class="key-picker" hidden>
        <div class="picker-row">
          <span class="picker-label">Major</span>
          <div id="pick-major" class="picker-keys"></div>
        </div>
        <div class="picker-row">
          <span class="picker-label">Minor</span>
          <div id="pick-minor" class="picker-keys"></div>
        </div>
      </section>

      <section class="result" aria-live="polite">
        <p class="eyebrow">Detected key</p>
        <h2 id="key-name">—</h2>
        <p id="scale-notes">Play on your keyboard to detect the key.</p>
        <p id="confidence"></p>
      </section>

      <div class="keyboard-scroll">
        <div class="piano-frame">
          <div id="piano" class="piano" role="img" aria-label="Piano keyboard. No scale highlighted yet."></div>
        </div>
      </div>
    </main>
    <script src="key.js"></script>
    <script src="app.js"></script>
  </body>
</html>
